name = "futuristic-restaurant-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[env.staging]
name = "futuristic-restaurant-backend-staging"

[env.production]
name = "futuristic-restaurant-backend-prod"

# D1 Database bindings
[[env.staging.d1_databases]]
binding = "DB"
database_name = "futuristic-restaurant-staging"
database_id = "your-staging-database-id"

[[env.production.d1_databases]]
binding = "DB"
database_name = "futuristic-restaurant-prod"
database_id = "your-production-database-id"

# KV Namespace bindings
[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "your-staging-kv-id"
preview_id = "your-staging-kv-preview-id"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "your-production-kv-id"

# R2 Bucket bindings
[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "futuristic-restaurant-media-staging"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "futuristic-restaurant-media-prod"

# Durable Objects bindings
[[env.staging.durable_objects.bindings]]
name = "ORDER_MANAGER"
class_name = "OrderManager"

[[env.production.durable_objects.bindings]]
name = "ORDER_MANAGER"
class_name = "OrderManager"

# Environment variables
[env.staging.vars]
ENVIRONMENT = "staging"
JWT_SECRET = "your-staging-jwt-secret"
JWT_REFRESH_SECRET = "your-staging-refresh-secret"
ENCRYPTION_KEY = "your-staging-encryption-key"
GOOGLE_MAPS_API_KEY = "your-google-maps-api-key"
STRIPE_SECRET_KEY = "your-stripe-secret-key"

[env.production.vars]
ENVIRONMENT = "production"
JWT_SECRET = "your-production-jwt-secret"
JWT_REFRESH_SECRET = "your-production-refresh-secret"
ENCRYPTION_KEY = "your-production-encryption-key"
GOOGLE_MAPS_API_KEY = "your-google-maps-api-key"
STRIPE_SECRET_KEY = "your-stripe-secret-key"

# Local development
[env.development]
name = "futuristic-restaurant-backend-dev"

[[env.development.d1_databases]]
binding = "DB"
database_name = "futuristic-restaurant-dev"

[[env.development.kv_namespaces]]
binding = "CACHE"
id = "your-dev-kv-id"

[[env.development.r2_buckets]]
binding = "MEDIA"
bucket_name = "futuristic-restaurant-media-dev"

[env.development.vars]
ENVIRONMENT = "development"
JWT_SECRET = "your-dev-jwt-secret"
JWT_REFRESH_SECRET = "your-dev-refresh-secret"
ENCRYPTION_KEY = "your-dev-encryption-key"
